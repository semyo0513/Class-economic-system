<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>클래스 타운 - 동물의 숲 2D 학급경영 & 미니룸</title>
  
  <!-- Phaser 3 & Firebase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4ade80;
      --primary-dark: #22c55e;
      --secondary: #38bdf8;
      --accent: #f472b6;
      --bg-cream: #fdfbf7;
      --border-retro: #4b5563;
      --text-dark: #1e293b;
      --modal-bg: #fffdf7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Galmuri11', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e293b;
    }

    /* 로딩 인디케이터 */
    #global-loading {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .loading-spinner-box {
      width: 48px;
      height: 48px;
      border: 5px solid #fff;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 로그인 화면 */
    #login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #a7f3d0 0%, #bae6fd 50%, #fbcfe8 100%);
      z-index: 50000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf7;
      border: 4px solid #334155;
      border-radius: 16px;
      box-shadow: 0 8px 0 #334155, 0 20px 25px rgba(0,0,0,0.15);
      padding: 26px 20px;
      text-align: center;
    }
    .login-logo {
      font-size: 30px;
      font-weight: bold;
      color: #065f46;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .login-form .input-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .login-form label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 5px;
    }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #f8fafc;
    }
    .pixel-btn-primary {
      width: 100%;
      padding: 12px 16px;
      background: #22c55e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: 3px solid #14532d;
      border-radius: 8px;
      box-shadow: 0 4px 0 #14532d;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pixel-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14532d;
    }
    .admin-check-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }

    /* 메인 게임 캔버스 */
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #game-canvas-wrap {
      width: 100%;
      height: 100%;
    }

    /* 상단 HUD */
    #top-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(255, 253, 247, 0.95);
      border: 3px solid #334155;
      border-radius: 10px;
      box-shadow: 0 3px 0 #334155;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .hud-btn {
      pointer-events: auto;
      background: #f8fafc;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 2px 0 #334155;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .hud-admin-btn {
      background: #fee2e2;
      color: #991b1b;
      border-color: #991b1b;
      box-shadow: 0 3px 0 #991b1b;
      font-weight: bold;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* 실시간 미니맵 레이더 HUD */
    #minimap-hud-wrap {
      position: absolute;
      top: 65px;
      right: 12px;
      background: rgba(255, 253, 247, 0.95);
      border: 3px solid #334155;
      border-radius: 10px;
      box-shadow: 0 4px 0 #334155;
      padding: 6px;
      z-index: 1000;
      text-align: center;
    }
    .minimap-title {
      font-size: 10px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    #minimap-canvas {
      border: 1px solid #94a3b8;
      border-radius: 6px;
      display: block;
    }

    /* 하단 실시간 채팅창 */
    #chat-hud-wrap {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 300px;
      max-height: 200px;
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid #475569;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      color: white;
    }
    #chat-messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 130px;
    }
    .chat-item strong { color: #38bdf8; }
    #chat-input-row {
      display: flex;
      padding: 6px;
      border-top: 1px solid #334155;
      gap: 4px;
    }
    #chat-input {
      flex: 1;
      padding: 6px 8px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: white;
      font-size: 11px;
      outline: none;
    }
    #chat-send-btn {
      padding: 6px 12px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    /* 모바일 반응형 조이스틱 & UI */
    #mobile-controls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1500;
    }
    @media (max-width: 768px) {
      #mobile-controls { display: block; }
      #minimap-hud-wrap { top: auto; bottom: 85px; right: 12px; transform: scale(0.85); transform-origin: bottom right; }
      #chat-hud-wrap { width: 180px; max-height: 120px; bottom: 85px; left: 10px; }
      #top-hud { font-size: 11px; }
      .hud-card { padding: 4px 8px; gap: 4px; }
      #modal-container { max-height: 96vh !important; border-radius: 12px !important; }
    }
    .d-pad-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }
    .d-btn {
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
    .d-btn:active { background: rgba(34, 197, 94, 0.85); }
    .action-btn-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      pointer-events: auto;
    }
    .action-circle-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #f59e0b;
      border: 4px solid #78350f;
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #78350f;
      cursor: pointer;
    }
    .action-circle-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #78350f;
    }

    /* 모달 팝업 시스템 */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #modal-container {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      background: var(--modal-bg);
      border: 4px solid #334155;
      border-radius: 16px;
      box-shadow: 0 8px 0 #334155, 0 25px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header-bar {
      background: #f1f5f9;
      border-bottom: 3px solid #cbd5e1;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header-title {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-close-btn {
      background: #ef4444;
      color: white;
      border: 2px solid #991b1b;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* 공용 컴포넌트 */
    .tab-btn {
      padding: 7px 12px;
      background: #e2e8f0;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .tab-btn.active {
      background: #22c55e;
      color: white;
      border-color: #15803d;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .shop-item-card {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .item-emoji { font-size: 32px; }
    .item-name { font-weight: bold; font-size: 12px; color: #1e293b; }
    .item-price { font-size: 11px; color: #0284c7; font-weight: bold; }
    .pixel-btn-sm {
      padding: 4px 8px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #0284c7;
      border-radius: 4px;
      cursor: pointer;
    }
    .pixel-btn-secondary {
      padding: 6px 12px;
      background: #94a3b8;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #475569;
      border-radius: 6px;
      cursor: pointer;
    }
    .pixel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    .pixel-table th, .pixel-table td {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
    }
    .pixel-table th {
      background: #f1f5f9;
      font-weight: bold;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-primary { background: #bae6fd; color: #0369a1; }
    .badge-success { background: #bbf7d0; color: #15803d; }
    .badge-danger { background: #fecdd3; color: #be123c; }

    /* 기숙사 미니룸 */
    .dorm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .dorm-card {
      background: #fff;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .dorm-card:hover { transform: translateY(-2px); border-color: var(--primary-dark); }
    .my-room-card { border-color: #f59e0b; background: #fffbeb; }
    .miniroom-container { display: flex; flex-direction: column; gap: 10px; }
    .miniroom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }
    .miniroom-stage-wrap {
      width: 100%;
      height: 260px;
      border: 3px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .miniroom-stage { width: 100%; height: 100%; position: relative; }
    .miniroom-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 130px;
      border-top: 3px solid rgba(0,0,0,0.15);
    }
    .placed-furniture {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
    }
    .editable-furniture { border: 2px dashed #f59e0b; padding: 2px; border-radius: 6px; }
    .furn-del-btn { position: absolute; top: -8px; right: -8px; font-size: 11px; cursor: pointer; }
    .miniroom-avatar { position: absolute; z-index: 20; text-align: center; }
    .avatar-tag { font-size: 10px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; }
    .avatar-sprite { font-size: 28px; }
    .palette-items { display: flex; gap: 8px; overflow-x: auto; padding: 6px; }
    .palette-card {
      min-width: 80px;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
    }
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .seat-cell {
      height: 54px;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }
    .my-seat { background: #fef08a; border-color: #ca8a04; font-weight: bold; }
    .sale-seat { background: #dbeafe; border-color: #2563eb; }
    .blackboard-indicator {
      text-align: center;
      padding: 8px;
      background: #334155;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .emotion-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
    }
    .emotion-btn {
      flex: 1;
      padding: 14px;
      border: 3px solid #334155;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }
    .btn-green { background: #dcfce7; }
    .btn-yellow { background: #fef9c3; }
    .btn-red { background: #fee2e2; }
    .emo-icon { font-size: 28px; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- 로딩 인디케이터 -->
  <div id="global-loading">
    <div class="loading-spinner-box"></div>
    <div id="global-loading-text">처리 중입니다...</div>
  </div>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">🌲 클래스 타운 🌸</div>
      <div class="login-sub">동물의 숲 2D 학급경영 & 기숙사 미니룸</div>

      <div class="login-form">
        <div class="input-group">
          <label>👨‍🎓 학생 이름</label>
          <input type="text" id="login-name-input" placeholder="이름을 입력하세요 (예: 홍길동)" onkeydown="if(event.key==='Enter') handleLogin()">
        </div>
        <div class="input-group">
          <label>🔑 비밀번호 (선택/기본: 1234, 관리자: 0513)</label>
          <input type="password" id="login-pw-input" placeholder="비밀번호 입력 (선택)" onkeydown="if(event.key==='Enter') handleLogin()">
        </div>
        <button class="pixel-btn-primary" onclick="handleLogin()">🎮 마을 즉시 입장하기</button>

        <div style="margin-top:12px; font-size:11px; color:#475569;">
          <span>💡 등록 학생 빠른 선택:</span>
          <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin-top:6px;">
            <button type="button" class="pixel-btn-sm" onclick="selectQuickStudent('김현주')">김현주</button>
            <button type="button" class="pixel-btn-sm" onclick="selectQuickStudent('이하진')">이하진</button>
            <button type="button" class="pixel-btn-sm" onclick="selectQuickStudent('정수빈')">정수빈</button>
            <button type="button" class="pixel-btn-sm" onclick="selectQuickStudent('서언')">서언</button>
            <button type="button" class="pixel-btn-sm" onclick="selectQuickStudent('홍길동')">홍길동</button>
            <button type="button" class="pixel-btn-sm" style="background:#fee2e2; color:#991b1b;" onclick="selectQuickAdmin()">선생님(관리자)</button>
          </div>
        </div>

        <label class="admin-check-wrap" style="margin-top:14px;">
          <input type="checkbox" id="admin-login-checkbox">
          <span>교사(관리자) 로그인으로 시작</span>
        </label>
      </div>
    </div>
  </div>

  <!-- 2. 메인 게임 화면 -->
  <div id="game-container">
    <div id="game-canvas-wrap"></div>

    <!-- 상단 HUD -->
    <div id="top-hud">
      <div class="hud-card">
        <span id="hud-school-name">🏫 행복초</span>
        <span>|</span>
        <span id="hud-player-name">👤 <strong>학생</strong></span>
        <span>|</span>
        <span id="hud-job-badge" class="badge badge-primary">학생</span>
      </div>

      <div class="hud-card">
        <span>💰 현금: <strong id="hud-cash-val" style="color:#15803d;">0원</strong></span>
        <span>📈 주식: <strong id="hud-stock-val" style="color:#0284c7;">0원</strong></span>
      </div>

      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <!-- 상단 간편모드 (게시판 모드) 버튼 -->
        <button class="hud-btn" style="background:#fef3c7; color:#b45309; border-color:#d97706; font-weight:bold;" onclick="ModalManager.open('quick_board')">
          📋 간편모드
        </button>
        <!-- 상단 우편함 버튼 -->
        <button class="hud-btn" style="background:#fdf2f8; color:#be185d; border-color:#db2777; font-weight:bold;" onclick="ModalManager.open('mailbox')">
          📬 우편함
        </button>
        <!-- 상단 인벤토리 (가방/장착) 버튼 -->
        <button class="hud-btn" style="background:#e0f2fe; color:#0369a1; border-color:#0284c7; font-weight:bold;" onclick="ModalManager.open('inventory')">
          🎒 인벤토리
        </button>
        <!-- 상단 교장실 (관리자 설정) 퀵 버튼 -->
        <button class="hud-btn hud-admin-btn" id="hud-admin-btn" style="display:none;" onclick="ModalManager.open('principal')">
          🏫 교장실
        </button>
        <button class="hud-btn" onclick="SoundEngine.toggleBGM()">🎵 BGM</button>
        <button class="hud-btn" onclick="openSettingsModal()">⚙️ 설정</button>
      </div>
    </div>

    <!-- 실시간 미니맵 레이더 HUD -->
    <div id="minimap-hud-wrap">
      <div class="minimap-title">
        <span>🗺️ 미니맵</span>
        <span style="color:#ef4444;">● 내 위치</span>
      </div>
      <canvas id="minimap-canvas" width="130" height="100"></canvas>
    </div>

    <!-- 하단 실시간 채팅 HUD -->
    <div id="chat-hud-wrap">
      <div id="chat-messages-list">
        <div class="chat-item" style="color:#94a3b8;">[안내] 마을에 입장했습니다.</div>
      </div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="채팅 입력 (Enter)" onkeydown="if(event.key==='Enter') sendChat()">
        <button id="chat-send-btn" onclick="sendChat()">전송</button>
      </div>
    </div>

    <!-- 모바일 가상 조이스틱 -->
    <div id="mobile-controls">
      <div class="d-pad-container">
        <div></div>
        <div class="d-btn" ontouchstart="setDpad(0,-1)" ontouchend="setDpad(0,0)">▲</div>
        <div></div>
        <div class="d-btn" ontouchstart="setDpad(-1,0)" ontouchend="setDpad(0,0)">◀</div>
        <div></div>
        <div class="d-btn" ontouchstart="setDpad(1,0)" ontouchend="setDpad(0,0)">▶</div>
        <div></div>
        <div class="d-btn" ontouchstart="setDpad(0,1)" ontouchend="setDpad(0,0)">▼</div>
        <div></div>
      </div>
      <div class="action-btn-container">
        <div class="action-circle-btn" onclick="triggerMobileAction()">E</div>
      </div>
    </div>
  </div>

  <!-- 3. 모달 컨테이너 -->
  <div id="modal-overlay">
    <div id="modal-container">
      <div class="modal-header-bar">
        <div class="modal-header-title" id="modal-title">🏛️ 건물명</div>
        <div class="modal-close-btn" onclick="ModalManager.close()">✕</div>
      </div>
      <div class="modal-scroll-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 자바스크립트 모듈 로드 -->
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/mapData.js"></script>
  <script src="js/miniroom.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/game.js"></script>

  <script>
    window.MobileJoystickVector = { x: 0, y: 0 };
    function setDpad(x, y) {
      window.MobileJoystickVector.x = x;
      window.MobileJoystickVector.y = y;
    }
    function triggerMobileAction() {
      if (window.GameApp) {
        const scene = window.GameApp.scene.getScene('TownScene');
        if (scene && scene.nearTarget) {
          if (scene.nearTarget.type === 'building') {
            ModalManager.open(scene.nearTarget.id);
          } else if (scene.nearTarget.type === 'dialog') {
            SoundEngine.open();
            alert(`[${scene.nearTarget.name}]\n\n"${scene.nearTarget.dialog}"`);
          }
        }
      }
    }

    function selectQuickStudent(name) {
      document.getElementById('login-name-input').value = name;
      document.getElementById('login-pw-input').value = '1234';
      document.getElementById('admin-login-checkbox').checked = false;
      handleLogin();
    }

    function selectQuickAdmin() {
      document.getElementById('login-name-input').value = '선생님';
      document.getElementById('login-pw-input').value = '0513';
      document.getElementById('admin-login-checkbox').checked = true;
      handleLogin();
    }

    async function handleLogin() {
      SoundEngine.click();
      const nameInput = document.getElementById('login-name-input');
      const pwInput = document.getElementById('login-pw-input');
      const isAdminCheck = document.getElementById('admin-login-checkbox').checked;

      const name = nameInput.value.trim() || (isAdminCheck ? '선생님' : '학생1');
      const pw = pwInput.value.trim() || (isAdminCheck ? '0513' : '1234');

      // 1. 임시 학생 객체로 게임 화면 즉시 진입 (멈춤/지연 0%)
      if (isAdminCheck) {
        GameState.isAdmin = true;
        GameState.student = { name: '선생님', 이름: '선생님', job: '교사(관리자)', 직업명: '교사(관리자)', cash: 999999, 현금: 999999, stock: 999999, 주식: 999999, permission: '전체', 권한: '전체' };
      } else {
        GameState.student = {
          id: 1, name: name, 이름: name,
          job: '학생', 직업명: '학생',
          cash: 50000, 현금: 50000,
          stock: 20000, 주식: 20000, stockQty: 10,
          totalAsset: 70000,
          permission: '일반', 권한: '일반'
        };
      }

      startGameAfterLogin();

      // 2. 백그라운드에서 구글 시트 실제 자산 및 랭킹 비동기 동기화
      try {
        if (isAdminCheck) {
          API.call('adminAuth', { pw }, true).then(res => {
            if (res && (res.success || res.isAdmin)) {
              GameState.isAdmin = true;
              const adminBtn = document.getElementById('hud-admin-btn');
              if (adminBtn) adminBtn.style.display = 'inline-flex';
            }
          });
        } else {
          API.call('studentLogin', { name, pw }, true).then(res => {
            if (res && res.success && res.student) {
              GameState.student = res.student;
              GameState.rankingList = res.ranking || [];
              GameState.settings = res.settings || {};
              if (res.student.permission === '전체' || res.student.권한 === '전체') {
                GameState.isAdmin = true;
                const adminBtn = document.getElementById('hud-admin-btn');
                if (adminBtn) adminBtn.style.display = 'inline-flex';
              }
              // HUD 갱신
              const cash = res.student.cash ?? res.student.현금 ?? 0;
              const stock = res.student.stock ?? res.student.주식 ?? 0;
              const job = res.student.job || res.student.직업명 || '학생';
              const nameEl = document.getElementById('hud-player-name');
              const jobEl = document.getElementById('hud-job-badge');
              const cashEl = document.getElementById('hud-cash-val');
              const stockEl = document.getElementById('hud-stock-val');
              if (nameEl) nameEl.innerHTML = `👤 <strong>${res.student.name || name}</strong>`;
              if (jobEl) jobEl.textContent = `${job}`;
              if (cashEl) cashEl.textContent = `${cash.toLocaleString()}원`;
              if (stockEl) stockEl.textContent = `${stock.toLocaleString()}원`;
            }
          });
        }
      } catch (err) {
        console.warn('[Sync in background failed]', err);
      }
    }

    function startGameAfterLogin() {
      API.hideLoading();
      SoundEngine.enter();
      document.getElementById('login-screen').style.display = 'none';

      const st = GameState.student || {};
      const name = st.name || st.이름 || '학생';
      const job = st.job || st.직업명 || '학생';
      const cash = st.cash ?? st.현금 ?? 0;
      const stock = st.stock ?? st.주식 ?? 0;

      document.getElementById('hud-player-name').innerHTML = `👤 <strong>${name}</strong>`;
      document.getElementById('hud-job-badge').textContent = `${job}`;
      document.getElementById('hud-cash-val').textContent = `${cash.toLocaleString()}원`;
      document.getElementById('hud-stock-val').textContent = `${stock.toLocaleString()}원`;

      if (GameState.isAdmin || st.permission === '전체' || st.권한 === '전체') {
        GameState.isAdmin = true;
        document.getElementById('hud-admin-btn').style.display = 'inline-flex';
      }

      initPhaserGame();
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      if (!input || !input.value.trim()) return;
      const msg = input.value.trim();
      const st = GameState.student;
      const myName = st ? (st.name || st.이름 || '익명') : '익명';

      Realtime.sendMessage(msg);
      API.call('logChat', { name: myName, msg: msg }, true);
      input.value = '';
    }

    function openSettingsModal() {
      SoundEngine.open();
      const overlay = document.getElementById('modal-overlay');
      const titleEl = document.getElementById('modal-title');
      const bodyEl = document.getElementById('modal-body');

      titleEl.innerHTML = '⚙️ 환경설정';
      bodyEl.innerHTML = `
        <div style="padding: 10px;">
          <h4>🔑 비밀번호 변경</h4>
          <div style="margin: 10px 0;">
            <input type="password" id="new-pw-input" placeholder="새 비밀번호 입력" style="padding:8px; width:100%; border:2px solid #94a3b8; border-radius:6px;">
          </div>
          <button class="pixel-btn-primary" onclick="alert('비밀번호가 변경되었습니다!')">비밀번호 저장</button>

          <h4 style="margin-top:20px;">🔊 사운드 설정</h4>
          <div style="margin: 10px 0; display:flex; gap:10px;">
            <button class="pixel-btn-secondary" onclick="SoundEngine.toggleMute()">효과음 음소거 토글</button>
            <button class="pixel-btn-secondary" onclick="SoundEngine.toggleBGM()">배경음악 BGM 토글</button>
          </div>
        </div>
      `;
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
